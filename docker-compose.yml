# Dev environment per docs/03-architecture.md §8: Postgres, queue store, MinIO.
# Valkey (BSD-3) is used instead of Redis per docs/08 §2 licensing decision.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myroom
      POSTGRES_PASSWORD: myroom
      POSTGRES_DB: myroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: myroom
      MINIO_ROOT_PASSWORD: myroom-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
